<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A" />
      <stop offset="50%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <!-- Neon Timer Ring Gradient -->
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Center Pivot Gradient -->
    <linearGradient id="pivotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Dial Shadow -->
    <filter id="dialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Obsidian Bento Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Outer Ambient Glow Bloom -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366F1" stroke-width="12" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Background Track Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="24" stroke-linecap="round" />

  <!-- Active Neon Progress Ring (270 degrees sweep) -->
  <circle
    cx="256"
    cy="256"
    r="150"
    fill="none"
    stroke="url(#timerGrad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-dasharray="942.48"
    stroke-dashoffset="235.62"
    transform="rotate(-90 256 256)"
    filter="url(#neonGlow)"
  />

  <!-- High-Precision Minute Ticks -->
  <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="84" x2="256" y2="96" />
    <line x1="428" y1="256" x2="416" y2="256" />
    <line x1="256" y1="428" x2="256" y2="416" />
    <line x1="84" y1="256" x2="96" y2="256" />
  </g>

  <!-- Inner Concentric Bezel -->
  <circle cx="256" cy="256" r="110" fill="#0D0E14" stroke="rgba(255, 255, 255, 0.05)" stroke-width="3" filter="url(#dialShadow)" />

  <!-- Sleek Clock Hands -->
  <!-- Hour Hand pointing at 10 o'clock -->
  <line x1="256" y1="256" x2="204" y2="194" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round" />
  
  <!-- Minute Hand pointing at 12 o'clock -->
  <line x1="256" y1="256" x2="256" y2="162" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

  <!-- Second Hand Pointer (Cyan Accent pointing at 2 o'clock) -->
  <line x1="256" y1="256" x2="318" y2="208" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />

  <!-- Center Pivot Core -->
  <circle cx="256" cy="256" r="16" fill="url(#pivotGrad)" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
</svg>

